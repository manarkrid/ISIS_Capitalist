<div class="product-card" [class.locked]="(prod()?.quantite ?? 0) === 0 && !canBuy()">

  <!-- Image cliquable pour lancer la production -->
  <div class="icon-area" (click)="startFabrication()" [title]="'Lancer la production de ' + prod()?.name">
    <div class="icon-wrapper">
      <img
        class="round prod-img"
        [src]="gameService.server() + '/' + prod()?.logo"
        [alt]="prod()?.name"
        (error)="$any($event.target).src='placeholder.svg'"
      />
      <span class="qty-badge">{{ prod()?.quantite }}</span>
    </div>
  </div>

  <!-- Contenu -->
  <div class="content-area">
    <div class="product-header">
      <span class="product-name">{{ prod()?.name }}</span>
      <span class="product-revenue">
        <span [innerHTML]="(prod()?.revenu ?? 0) * (prod()?.quantite ?? 0) | bigvalue"></span> $
      </span>
    </div>

    <!-- Barre de progression -->
    <div class="progressbar">
      <div class="fill" [style.width.%]="progress()"></div>
    </div>
    <div class="timeleft-display">
      @if (timeleft() > 0) {
        {{ timeleft() | second }}
      } @else if ((prod()?.quantite ?? 0) === 0) {
        <span class="locked-msg">Achetez pour debloquer</span>
      } @else {
        <span class="ready-msg">Cliquez sur l'image pour produire</span>
      }
    </div>

    <!-- Bouton achat -->
    <button
      class="buy-btn"
      [class.can-buy]="canBuy()"
      [disabled]="!canBuy()"
      (click)="buy()"
      [title]="canBuy() ? 'Acheter ' + numberToBuy() + ' unites' : 'Pas assez d argent'"
    >
      <span class="buy-qty">x{{ numberToBuy() }}</span>
      <span class="buy-label">Acheter</span>
      <span class="buy-cost" [innerHTML]="costToBuy() | bigvalue"></span>
      <span class="buy-cost-sym">$</span>
    </button>
  </div>

</div>
